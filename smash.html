<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>SMASH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,700&family=Geist:wght@400;500;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #F6F4F0;
    --white:   #FFFFFF;
    --text:    #1A1A18;
    --muted:   #9A9690;
    --border:  rgba(0,0,0,0.07);
    --red:     #E53935;
    --blue:    #1565C0;
    --green:   #52c41a;
  }

  html, body {
    width: 100%;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Geist', sans-serif;
    overflow: hidden;
  }

  #app {
    display: flex;
    width: 100%;
    min-height: 100dvh;
  }

  /* ── LEFT PANEL ─────────────────────────────────────────── */
  #panel {
    width: 260px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    padding: 2.5rem 2rem;
    display: flex;
    flex-direction: column;
    background: var(--white);
    position: relative;
    z-index: 10;
  }

  #wordmark {
    font-family: 'Geist Mono', monospace;
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 2.5rem;
  }

  #title-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  #title-script {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 3.2rem;
    font-weight: 400;
    line-height: 1;
    color: var(--text);
    transition: color 0.2s ease;
    margin-bottom: 0.1rem;
  }
  #title-script.shake-mode { color: var(--red); }
  #title-script.wave-mode  { color: var(--blue); }

  #title-bold {
    font-family: 'Geist', sans-serif;
    font-size: clamp(3.2rem, 5.5vw, 5rem);
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 0.85;
    color: var(--text);
    text-transform: uppercase;
    transition: color 0.2s ease;
  }
  #title-bold.shake-mode { color: var(--red); }
  #title-bold.wave-mode  { color: var(--blue); }

  #gesture-sub {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 1.1rem;
  }

  #divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 2rem 0;
  }

  #controls {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  #status-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
  }

  #status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ccc;
    flex-shrink: 0;
    transition: background 0.3s ease;
  }
  #status-dot.connected { background: var(--green); }
  #status-dot.pulse {
    background: var(--green);
    animation: pulse 0.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }

  #status-text {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    width: 100%;
    padding: 0.7rem 1rem;
    font-family: 'Geist Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: transform 0.08s ease, opacity 0.08s ease;
    user-select: none;
  }
  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: var(--text);
    color: #fff;
    border: none;
  }
  .btn-primary:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  .btn-primary:disabled:active { transform: none; }

  .btn-outline {
    background: transparent;
    color: var(--text);
    border: 1px solid rgba(0,0,0,0.12);
  }

  .btn kbd {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    font-size: 8px;
  }
  .btn-outline kbd {
    background: rgba(0,0,0,0.06);
  }

  #shortcut-hint {
    font-family: 'Geist Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-top: 0.75rem;
    opacity: 0.6;
    line-height: 1.7;
  }

  /* ── STAGE ──────────────────────────────────────────────── */
  #stage {
    flex: 1;
    position: relative;
    background: var(--white);
    overflow: hidden;
  }

  #canvas {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* Stage corner label */
  #stage-label {
    position: absolute;
    top: 1.5rem;
    left: 1.75rem;
    font-family: 'Geist Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    z-index: 5;
    border: 1px solid var(--border);
    padding: 4px 10px;
    pointer-events: none;
  }

  /* ── SANDBAG ────────────────────────────────────────────── */
  #sandbag-wrap {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    transform-origin: top center;
    z-index: 2;
    pointer-events: none;
    will-change: transform;
  }

  #sandbag-string {
    display: block;
    margin: 0 auto;
    width: 1px;
    height: 90px;
    background: linear-gradient(to bottom, #C0BAB2, #A8A09A);
  }

  #sandbag-img {
    display: block;
    width: 160px;
    height: auto;
    margin: 0 auto;
    filter: drop-shadow(0 16px 32px rgba(0,0,0,0.14));
  }

  #sandbag-svg {
    display: block;
    margin: 0 auto;
    filter: drop-shadow(0 16px 32px rgba(0,0,0,0.10));
  }

  /* ── STRESS OBJECT ──────────────────────────────────────── */
  #object-wrap {
    position: absolute;
    z-index: 3;
    pointer-events: none;
    will-change: transform, opacity;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #object-content {
    position: relative;
    display: inline-block;
  }

  #object-img {
    display: block;
    width: 150px;
    height: auto;
    filter: drop-shadow(0 14px 28px rgba(0,0,0,0.13));
  }

  #object-svg-wrap {
    filter: drop-shadow(0 14px 28px rgba(0,0,0,0.10));
  }

  /* Red count badge (1X, 3X style from reference) */
  #object-badge {
    position: absolute;
    top: -14px;
    right: -16px;
    min-width: 46px;
    height: 46px;
    background: var(--red);
    color: #fff;
    border-radius: 23px;
    display: none;
    align-items: center;
    justify-content: center;
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    padding: 0 10px;
    z-index: 4;
  }

  #object-annotation {
    margin-top: 14px;
    font-family: 'Geist Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    white-space: nowrap;
  }

  /* ── IMPACT WORD ────────────────────────────────────────── */
  #impact-word {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    pointer-events: none;
    text-align: center;
    opacity: 0;
    white-space: nowrap;
  }

  #impact-script {
    display: block;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: clamp(2rem, 5vw, 4rem);
    font-weight: 400;
    color: var(--red);
    line-height: 1.1;
  }
  #impact-script.wave-mode { color: var(--blue); }

  #impact-bold {
    display: block;
    font-family: 'Geist', sans-serif;
    font-size: clamp(4rem, 11vw, 9rem);
    font-weight: 900;
    letter-spacing: -0.04em;
    color: var(--text);
    line-height: 0.82;
    text-transform: uppercase;
  }

  /* ── FLASH ──────────────────────────────────────────────── */
  #flash {
    position: absolute;
    inset: 0;
    z-index: 15;
    pointer-events: none;
    opacity: 0;
    background: rgba(229,57,53,0.05);
  }
  #flash.wave-flash { background: rgba(21,101,192,0.04); }

  /* ── SCREEN SHAKE ───────────────────────────────────────── */
  #stage.shake-anim {
    animation: screen-shake 0.18s ease;
  }
  @keyframes screen-shake {
    0%   { transform: translate(0, 0); }
    14%  { transform: translate(-5px, 2px); }
    28%  { transform: translate(5px, -2px); }
    42%  { transform: translate(-4px, 4px); }
    57%  { transform: translate(4px, -2px); }
    71%  { transform: translate(-2px, 2px); }
    85%  { transform: translate(2px, -1px); }
    100% { transform: translate(0, 0); }
  }

  /* ── CLEARED BANNER ─────────────────────────────────────── */
  #cleared-banner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 25;
    text-align: center;
    opacity: 0;
    pointer-events: none;
  }
  #cleared-banner .script-line {
    display: block;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: clamp(2.5rem, 6vw, 5rem);
    font-weight: 400;
    color: var(--text);
    line-height: 1.1;
  }
  #cleared-banner .bold-line {
    display: block;
    font-family: 'Geist', sans-serif;
    font-size: clamp(3.5rem, 8vw, 6.5rem);
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 0.85;
    color: var(--text);
    text-transform: uppercase;
  }
  #cleared-banner .cleared-sub {
    font-family: 'Geist Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 1.25rem;
  }

  /* ── TICKER STRIP ───────────────────────────────────────── */
  #ticker {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 34px;
    background: var(--text);
    overflow: hidden;
    z-index: 30;
    display: flex;
    align-items: center;
  }
  #ticker-track {
    display: flex;
    white-space: nowrap;
    animation: ticker-scroll 22s linear infinite;
  }
  .t-item {
    font-family: 'Geist Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    padding: 0 1.2rem;
    user-select: none;
  }
  .t-dot {
    color: rgba(229,57,53,0.55);
    padding: 0 0.2rem;
    font-size: 9px;
    font-family: 'Geist Mono', monospace;
    letter-spacing: 0;
  }
  @keyframes ticker-scroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
</style>
</head>
<body>
<div id="app">

  <!-- LEFT PANEL -->
  <aside id="panel">
    <div id="wordmark">SMASH · Gesture UI</div>

    <div id="title-block">
      <div id="title-script">Stress</div>
      <div id="title-bold">SMASH</div>
      <div id="gesture-sub">awaiting connection</div>
    </div>

    <hr id="divider">

    <div id="controls">
      <div id="status-row">
        <div id="status-dot"></div>
        <span id="status-text">disconnected</span>
      </div>
      <button class="btn btn-primary" id="btn-record" disabled>
        <kbd>R</kbd> record gesture
      </button>
      <button class="btn btn-outline" id="btn-connect">
        connect device
      </button>
      <div id="shortcut-hint">
        keyboard: 1 shake · 2 wave · 3 idle
      </div>
    </div>
  </aside>

  <!-- STAGE -->
  <main id="stage">
    <canvas id="canvas"></canvas>

    <div id="stage-label">10-minute break</div>

    <!-- Sandbag -->
    <div id="sandbag-wrap">
      <div id="sandbag-string"></div>
      <img id="sandbag-img" src="assets/sandbag.png" alt=""
           onerror="this.style.display='none';document.getElementById('sandbag-svg-wrap').style.display='block'">
      <div id="sandbag-svg-wrap" style="display:none">
        <svg id="sandbag-svg" width="160" height="220" viewBox="0 0 160 220" fill="none">
          <ellipse cx="80" cy="28" rx="12" ry="8" fill="#D4C5A9" stroke="#B8A88A" stroke-width="1.5"/>
          <rect x="24" y="34" width="112" height="160" rx="6" fill="#F2EDE3" stroke="#C8B89A" stroke-width="1.5"/>
          <line x1="24" y1="88" x2="136" y2="88" stroke="#C8B89A" stroke-width="1" stroke-dasharray="6 4"/>
          <line x1="24" y1="128" x2="136" y2="128" stroke="#C8B89A" stroke-width="1" stroke-dasharray="6 4"/>
          <line x1="24" y1="168" x2="136" y2="168" stroke="#C8B89A" stroke-width="1" stroke-dasharray="6 4"/>
          <ellipse cx="80" cy="192" rx="56" ry="10" fill="#E8DECE" stroke="#C8B89A" stroke-width="1"/>
        </svg>
      </div>
    </div>

    <!-- Stress object -->
    <div id="object-wrap" style="display:none; opacity:0">
      <div id="object-content">
        <img id="object-img" src="" alt="" style="display:none">
        <div id="object-svg-wrap"></div>
        <div id="object-badge"></div>
      </div>
      <div id="object-annotation"></div>
    </div>

    <!-- Impact word -->
    <div id="impact-word">
      <span id="impact-script"></span>
      <span id="impact-bold"></span>
    </div>

    <!-- Flash overlay -->
    <div id="flash"></div>

    <!-- Cleared banner -->
    <div id="cleared-banner">
      <span class="script-line">All</span>
      <span class="bold-line">CLEAR</span>
      <div class="cleared-sub">restarting cycle</div>
    </div>

    <!-- Ticker strip -->
    <div id="ticker">
      <div id="ticker-track">
        <span class="t-item">shake</span><span class="t-dot">·</span>
        <span class="t-item">wave</span><span class="t-dot">·</span>
        <span class="t-item">smash</span><span class="t-dot">·</span>
        <span class="t-item">punch</span><span class="t-dot">·</span>
        <span class="t-item">stress relief</span><span class="t-dot">·</span>
        <span class="t-item">clear</span><span class="t-dot">·</span>
        <span class="t-item">slice</span><span class="t-dot">·</span>
        <span class="t-item">feel better</span><span class="t-dot">·</span>
        <!-- duplicate for seamless loop -->
        <span class="t-item">shake</span><span class="t-dot">·</span>
        <span class="t-item">wave</span><span class="t-dot">·</span>
        <span class="t-item">smash</span><span class="t-dot">·</span>
        <span class="t-item">punch</span><span class="t-dot">·</span>
        <span class="t-item">stress relief</span><span class="t-dot">·</span>
        <span class="t-item">clear</span><span class="t-dot">·</span>
        <span class="t-item">slice</span><span class="t-dot">·</span>
        <span class="t-item">feel better</span><span class="t-dot">·</span>
      </div>
    </div>
  </main>
</div>

<script>

// ── STATE ────────────────────────────────────────────────────────────────────

  objectQueue: [],
  currentObjectKey: null,

  counts: { shake: 0, wave: 0, idle: 0 },
  lastGesture: null,

  port: null,
  reader: null,
  writer: null,
  connected: false,

  bagAngle: 0,
  bagVelocity: 0,
  bagDamping: 0.93,
  bagIdlePhase: 0,

  objectX: 0,
  objectY: 0,
  objectTilt: 0,
  objectPhase: 0,
  objectVisible: false,
};

// ── DOM REFS ─────────────────────────────────────────────────────────────────

const $canvas        = document.getElementById('canvas');
const $stage         = document.getElementById('stage');
const $sandbagWrap   = document.getElementById('sandbag-wrap');
const $objectWrap    = document.getElementById('object-wrap');
const $objectContent = document.getElementById('object-content');
const $objectBadge   = document.getElementById('object-badge');
const $objectAnnotation = document.getElementById('object-annotation');
const $impactWord    = document.getElementById('impact-word');
const $impactScript  = document.getElementById('impact-script');
const $impactBold    = document.getElementById('impact-bold');
const $flash         = document.getElementById('flash');
const $clearedBanner = document.getElementById('cleared-banner');

const $titleScript   = document.getElementById('title-script');
const $titleBold     = document.getElementById('title-bold');
const $gestureSub    = document.getElementById('gesture-sub');
const $statusDot     = document.getElementById('status-dot');
const $statusText    = document.getElementById('status-text');
const $btnRecord     = document.getElementById('btn-record');
const $btnConnect    = document.getElementById('btn-connect');

const ctx = $canvas.getContext('2d');

function getObjectImg()    { return document.getElementById('object-img'); }
function getObjectSvgWrap(){ return document.getElementById('object-svg-wrap'); }

// ── CANVAS RESIZE ─────────────────────────────────────────────────────────────

function resizeCanvas() {
  $canvas.width  = $stage.offsetWidth;
  $canvas.height = $stage.offsetHeight;
}
new ResizeObserver(resizeCanvas).observe($stage);
resizeCanvas();

// ── PARTICLE SYSTEM ──────────────────────────────────────────────────────────

const particles = [];
const ripples   = [];

class Particle {
  constructor(x, y, type) {
    this.x = x;
    this.y = y;
    this.shape = Math.random() < 0.5 ? 'rect' : 'circle';
    this.size  = 4 + Math.random() * 8;
    const speed = 4 + Math.random() * 10;
    const angle = Math.random() * Math.PI * 2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed - (type === 'shake' ? 4 : 2);
    this.gravity  = 0.5;
    this.decay    = type === 'shake' ? 0.016 + Math.random() * 0.012 : 0.018 + Math.random() * 0.010;
    this.alpha    = 1;
    this.rot      = Math.random() * Math.PI * 2;
    this.rotV     = (Math.random() - 0.5) * 0.3;
    if (type === 'shake') {
      const cols = ['#E53935', '#1A1A18', '#9A9690', '#C8C5C0', '#ffffff'];
      this.color = cols[Math.floor(Math.random() * cols.length)];
    } else {
      const cols = ['#1565C0', '#1a73e8', '#9A9690', '#C8D8F0', '#ffffff'];
      this.color = cols[Math.floor(Math.random() * cols.length)];
    }
  }
  update() {
    this.vy += this.gravity;
    this.vx *= 0.97;
    this.x  += this.vx;
    this.y  += this.vy;
    this.rot += this.rotV;
    this.alpha = Math.max(0, this.alpha - this.decay);
  }
  draw(ctx) {
    if (this.alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    if (this.shape === 'rect') {
      ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 0.6);
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

class Ripple {
  constructor(x, y) {
    this.x = x; this.y = y; this.r = 0; this.alpha = 0.6; this.speed = 9;
  }
  update() { this.r += this.speed; this.alpha -= 0.012; }
  draw(ctx) {
    if (this.alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.strokeStyle = '#1565C0';
    ctx.lineWidth   = 1.5;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

function spawnParticles(x, y, type) {
  const count = type === 'shake' ? 100 : 40;
  for (let i = 0; i < count; i++) particles.push(new Particle(x, y, type));
}

function spawnRipples(x, y) {
  for (let i = 0; i < 5; i++) setTimeout(() => ripples.push(new Ripple(x, y)), i * 80);
}

// ── SANDBAG PHYSICS ──────────────────────────────────────────────────────────

function punchBag(force) {
  state.bagVelocity = force * (Math.random() < 0.5 ? 1 : -1);
}

function updateBag() {
  if (state.gameState === 'IDLE' || !state.connected) {
    state.bagIdlePhase += 0.012;
    state.bagAngle = Math.sin(state.bagIdlePhase) * 3;
  } else {
    state.bagVelocity -= (state.bagAngle * 0.08);
    state.bagVelocity *= state.bagDamping;
    state.bagAngle    += state.bagVelocity;
  }
  $sandbagWrap.style.transform = `translateX(-50%) rotate(${state.bagAngle}deg)`;
}

// ── OBJECT MANAGEMENT ────────────────────────────────────────────────────────

function shuffleQueue() {
  const arr = [...OBJECT_QUEUE];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  state.objectQueue = arr;
}

function getObjectPosition() {
  const stageW = $stage.offsetWidth;
  const stageH = $stage.offsetHeight - 34; // account for ticker
  const side   = Math.random() < 0.5 ? -1 : 1;
  const x      = stageW / 2 + side * (100 + Math.random() * 80);
  const y      = stageH * 0.22 + Math.random() * stageH * 0.22;
  return { x, y };
}

function loadObject(key) {
  state.currentObjectKey = key;
  const imgSrc = `assets/${key}.png`;

  const img = new Image();
  img.onload = () => {
    const objImg = getObjectImg();
    const objSvg = getObjectSvgWrap();
    if (objImg) { objImg.src = imgSrc; objImg.style.display = 'block'; }
    if (objSvg) objSvg.innerHTML = '';
    showObject();
  };
  img.onerror = () => {
    const objImg = getObjectImg();
    const objSvg = getObjectSvgWrap();
    if (objImg) objImg.style.display = 'none';
    if (objSvg) objSvg.innerHTML = FALLBACK_SVGS[key] || '';
    showObject();
  };
  img.src = imgSrc;
}

function showObject() {
  const pos = getObjectPosition();
  state.objectX     = pos.x;
  state.objectY     = pos.y;
  state.objectTilt  = (Math.random() - 0.5) * 18;
  state.objectPhase = Math.random() * Math.PI * 2;
  state.objectVisible = true;

  // Badge
  $objectBadge.textContent    = OBJECT_COUNTS[state.currentObjectKey] || '';
  $objectBadge.style.display  = 'flex';
  $objectAnnotation.textContent = OBJECT_LABELS[state.currentObjectKey] || '';

  $objectWrap.style.display   = 'flex';
  $objectWrap.style.opacity   = '0';
  $objectWrap.style.transform = `translate(${state.objectX}px, ${state.objectY - 30}px) rotate(${state.objectTilt}deg)`;

  requestAnimationFrame(() => {
    $objectWrap.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
    $objectWrap.style.opacity    = '1';
    $objectWrap.style.transform  = `translate(${state.objectX}px, ${state.objectY}px) rotate(${state.objectTilt}deg)`;
    setTimeout(() => {
      $objectWrap.style.transition = '';
      state.gameState = 'OBJECT_ACTIVE';
    }, 420);
  });
}

function hideObject() {
  state.objectVisible = false;
  $objectWrap.style.display = 'none';
  $objectWrap.style.opacity = '0';
}

// ── GAME LOOP ────────────────────────────────────────────────────────────────

function startGame() {
  if (state.gameState !== 'IDLE') return;
  shuffleQueue();
  state.gameState = 'WAITING';
  setTimeout(nextObject, 500);
}

function nextObject() {
  if (state.objectQueue.length === 0) { showClearedBanner(); return; }
  const key = state.objectQueue.shift();
  loadObject(key);
}

function destroyObject(gestureType) {
  if (state.gameState !== 'OBJECT_ACTIVE') return;
  state.gameState = 'DESTROYING';

  const objImg = getObjectImg();
  const objSvg = getObjectSvgWrap();
  const objEl  = (objImg && objImg.style.display !== 'none') ? objImg : (objSvg ? objSvg.firstElementChild : null);
  const objW   = objEl ? (objEl.clientWidth  || 150) : 150;
  const objH   = objEl ? (objEl.clientHeight || 150) : 150;
  const cx     = state.objectX + objW / 2;
  const cy     = state.objectY + objH / 2;

  spawnParticles(cx, cy, gestureType);
  if (gestureType === 'wave') spawnRipples(cx, cy);

  const words = gestureType === 'shake' ? IMPACT_WORDS_SHAKE : IMPACT_WORDS_WAVE;
  const scrWords = gestureType === 'shake' ? SCRIPT_IMPACT_SHAKE : SCRIPT_IMPACT_WAVE;
  $impactScript.textContent = scrWords[Math.floor(Math.random() * scrWords.length)];
  $impactBold.textContent   = words[Math.floor(Math.random() * words.length)];
  $impactScript.className   = gestureType === 'wave' ? 'wave-mode' : '';
  animateImpactWord();
  triggerFlash(gestureType);

  if (gestureType === 'shake') {
    const angle = (Math.random() * Math.PI * 0.8) - Math.PI * 0.4 - Math.PI / 2;
    const dir   = { x: Math.cos(angle) * 22, y: Math.sin(angle) * 22 };
    let rot = state.objectTilt;
    let rotV = (Math.random() - 0.5) * 18;
    let scale = 1;
    let frame = 0;
    const totalFrames = 35;
    const startX = state.objectX;
    const startY = state.objectY;

    function step() {
      frame++;
      rot   += rotV;
      scale  = Math.max(0, 1 - frame / totalFrames);
      const nx = startX + dir.x * frame;
      const ny = startY + dir.y * frame;
      $objectWrap.style.transform = `translate(${nx}px, ${ny}px) rotate(${rot}deg) scale(${scale})`;
      $objectWrap.style.opacity   = String(Math.max(0, 1 - (frame / totalFrames) * 1.2));
      if (frame < totalFrames) requestAnimationFrame(step);
      else { hideObject(); schedulePause(); }
    }
    requestAnimationFrame(step);
  } else {
    // Wave: sweep off to the side with rotation
    let frame = 0;
    const totalFrames = 28;
    const startX = state.objectX;
    const startY = state.objectY;
    const sweepDir = Math.random() < 0.5 ? 1 : -1;

    function step() {
      frame++;
      const t     = frame / totalFrames;
      const sweep = t * 260 * sweepDir;
      const tilt  = state.objectTilt + t * 30 * sweepDir;
      const alpha = Math.max(0, 1 - t * 1.2);
      $objectWrap.style.transform = `translate(${startX + sweep}px, ${startY}px) rotate(${tilt}deg)`;
      $objectWrap.style.opacity   = String(alpha);
      if (frame < totalFrames) requestAnimationFrame(step);
      else { hideObject(); schedulePause(); }
    }
    requestAnimationFrame(step);
  }
}

function schedulePause() {
  state.gameState = 'PAUSE';
  // Restore object-wrap inner structure for next use
  $objectContent.innerHTML = `
    <img id="object-img" src="" alt="" style="display:none">
    <div id="object-svg-wrap"></div>
    <div id="object-badge"></div>
  `;
  // Re-bind badge ref (annotation stays)
  const newBadge = document.getElementById('object-badge');
  // use closure reference for annotation; badge is looked up fresh in showObject via getElementById
  setTimeout(() => {
    if (state.objectQueue.length === 0) showClearedBanner();
    else { state.gameState = 'WAITING'; nextObject(); }
  }, 600);
}

function showClearedBanner() {
  state.gameState = 'PAUSE';
  $clearedBanner.style.transition = 'opacity 0.4s ease';
  $clearedBanner.style.opacity    = '1';
  setTimeout(() => {
    $clearedBanner.style.opacity = '0';
    setTimeout(() => {
      state.cycleCount++;
      shuffleQueue();
      state.gameState = 'WAITING';
      nextObject();
    }, 500);
  }, 2200);
}

// ── EFFECTS ──────────────────────────────────────────────────────────────────

function animateImpactWord() {
  $impactWord.style.transition = 'none';
  $impactWord.style.opacity    = '0';
  $impactWord.style.transform  = 'translate(-50%, -50%) scale(1.15)';
  requestAnimationFrame(() => {
    $impactWord.style.transition = 'opacity 0.08s ease, transform 0.1s ease';
    $impactWord.style.opacity    = '1';
    $impactWord.style.transform  = 'translate(-50%, -50%) scale(1)';
    setTimeout(() => {
      $impactWord.style.transition = 'opacity 0.5s ease';
      $impactWord.style.opacity    = '0';
    }, 140);
  });
}

function triggerFlash(type) {
  $flash.className = type === 'wave' ? 'wave-flash' : '';
  $flash.style.transition = 'none';
  $flash.style.opacity    = '1';
  setTimeout(() => {
    $flash.style.transition = 'opacity 0.15s ease';
    $flash.style.opacity    = '0';
  }, 80);
}

function triggerScreenShake() {
  $stage.classList.remove('shake-anim');
  void $stage.offsetWidth;
  $stage.classList.add('shake-anim');
  $stage.addEventListener('animationend', () => $stage.classList.remove('shake-anim'), { once: true });
}

// ── IDLE OBJECT FLOAT ────────────────────────────────────────────────────────

function updateObjectFloat() {
  if (state.gameState !== 'OBJECT_ACTIVE' || !state.objectVisible) return;
  state.objectPhase += 0.018;
  const floatY = Math.sin(state.objectPhase) * 7;
  const floatR = Math.sin(state.objectPhase * 0.7) * 1.5;
  $objectWrap.style.transform = `translate(${state.objectX}px, ${state.objectY + floatY}px) rotate(${state.objectTilt + floatR}deg)`;
}

// ── MAIN ANIMATION LOOP ──────────────────────────────────────────────────────

function frame() {
  ctx.clearRect(0, 0, $canvas.width, $canvas.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update(); particles[i].draw(ctx);
    if (particles[i].alpha <= 0) particles.splice(i, 1);
  }
  for (let i = ripples.length - 1; i >= 0; i--) {
    ripples[i].update(); ripples[i].draw(ctx);
    if (ripples[i].alpha <= 0) ripples.splice(i, 1);
  }
  updateBag();
  updateObjectFloat();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ── GESTURE HANDLER ──────────────────────────────────────────────────────────

function handleGesture(label) {
  label = label.trim().toLowerCase();
  if (!['shake', 'wave', 'idle'].includes(label)) return;
  state.lastGesture = label;
  if (label !== 'idle') state.counts[label]++;

  $titleScript.textContent = SCRIPT_WORDS[label] || 'Stress';
  $titleBold.textContent   = label !== 'idle' ? label.toUpperCase() : 'SMASH';
  $titleScript.className   = label !== 'idle' ? `${label}-mode` : '';
  $titleBold.className     = label !== 'idle' ? `${label}-mode` : '';

  const countStr = label !== 'idle' ? ` · #${state.counts[label]}` : '';
  const subMap = {
    shake: `impact detected${countStr}`,
    wave:  `slice detected${countStr}`,
    idle:  `no gesture`,
  };
  $gestureSub.textContent = subMap[label];

  if (label === 'shake') {
    punchBag(14);
    triggerScreenShake();
    if (state.gameState === 'OBJECT_ACTIVE') destroyObject('shake');
    else if (state.gameState === 'IDLE' && state.connected) startGame();
  } else if (label === 'wave') {
    punchBag(6);
    if (state.gameState === 'OBJECT_ACTIVE') destroyObject('wave');
    else if (state.gameState === 'IDLE' && state.connected) startGame();
  }
}

// ── WEB SERIAL ───────────────────────────────────────────────────────────────

async function connectSerial() {
  if (!navigator.serial) { alert('Web Serial not supported. Use Chrome/Edge.'); return; }
  try {
    state.port = await navigator.serial.requestPort();
    await state.port.open({ baudRate: 115200 });
    state.connected = true;
    setConnectedUI(true);
    const decoder    = new TextDecoderStream();
    const textReader = decoder.readable.getReader();
    state.port.readable.pipeTo(decoder.writable);
    const writer = state.port.writable.getWriter();
    state.writer = writer;
    let buffer = '';
    (async () => {
      try {
        while (true) {
          const { value, done } = await textReader.read();
          if (done) break;
          buffer += value;
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            const clean = line.trim();
            if (!clean) continue;
            if (['READY','START','END','Recording...'].includes(clean)) continue;
            handleGesture(clean);
          }
        }
      } catch {}
      setConnectedUI(false);
      state.connected = false;
    })();
    startGame();
  } catch (e) {
    if (e.name !== 'NotFoundError') console.error(e);
  }
}

async function sendRecord() {
  if (!state.writer) return;
  try {
    await state.writer.write(new TextEncoder().encode('r'));
    $statusDot.className    = 'pulse';
    $statusText.textContent = 'recording…';
    setTimeout(() => {
      $statusDot.className    = 'connected';
      $statusText.textContent = 'connected';
    }, 2500);
  } catch (e) { console.error(e); }
}

function setConnectedUI(connected) {
  $statusDot.className    = connected ? 'connected' : '';
  $statusText.textContent = connected ? 'connected' : 'disconnected';
  $btnRecord.disabled     = !connected;
  $gestureSub.textContent = connected ? 'awaiting gesture' : 'awaiting connection';
  $btnConnect.textContent = connected ? 'disconnect' : 'connect device';
}

// ── KEYBOARD SHORTCUTS ───────────────────────────────────────────────────────

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  switch (e.key) {
    case '1': handleGesture('shake'); break;
    case '2': handleGesture('wave');  break;
    case '3': handleGesture('idle');  break;
    case 'r': case 'R':
      if (state.connected) sendRecord();
      else handleGesture('shake');
      break;
  }
});

// ── BUTTON LISTENERS ─────────────────────────────────────────────────────────

$btnConnect.addEventListener('click', () => {
  if (state.connected) {
    try { state.port?.close(); } catch {}
    setConnectedUI(false);
    state.connected = false;
    state.port = null; state.writer = null;
  } else {
    connectSerial();
  }
});
$btnRecord.addEventListener('click', sendRecord);

// ── INIT ─────────────────────────────────────────────────────────────────────

state.gameState = 'IDLE';
</script>
</body>
</html>
