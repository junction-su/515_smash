<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>SMASH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;700;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:    #111110;
  --paper:  #F4F2EE;
  --white:  #FFFFFF;
  --dim:    #79776F;
  --line:   rgba(17,17,16,0.08);
  --hit:    #D4351C;
  --sweep:  #1A56DB;
  --go:     #16A34A;
}

html, body {
  width: 100%; min-height: 100dvh;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Geist', sans-serif;
  overflow: hidden;
}

/* ─── LAYOUT ──────────────────────────────────────────────── */
#app { display: flex; width: 100%; min-height: 100dvh; }

/* ─── LEFT RAIL ───────────────────────────────────────────── */
#rail {
  width: 240px; flex-shrink: 0;
  background: var(--white);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  padding: 0;
  position: relative; z-index: 10;
}

#rail-top {
  padding: 2rem 1.75rem 1.5rem;
  border-bottom: 1px solid var(--line);
}

#brand {
  font-family: 'Geist Mono', monospace;
  font-size: 9px; font-weight: 400;
  letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 2rem;
}

/* Asymmetric headline block */
#hl-block { padding-right: 0; }

#hl-label {
  font-size: 9px; font-weight: 500;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 0.35rem;
  font-family: 'Geist Mono', monospace;
}

#hl-word {
  font-size: clamp(2.8rem, 5vw, 4.2rem);
  font-weight: 900;
  letter-spacing: -0.05em;
  line-height: 0.88;
  color: var(--ink);
  text-transform: uppercase;
  transition: color 0.12s ease;
  word-break: break-all;
}
#hl-word.is-shake { color: var(--hit); }
#hl-word.is-wave  { color: var(--sweep); }

#hl-sub {
  font-family: 'Geist Mono', monospace;
  font-size: 10px; font-weight: 400;
  letter-spacing: 0.06em;
  color: var(--dim);
  margin-top: 0.9rem;
  line-height: 1.5;
}

#rail-mid {
  flex: 1;
  padding: 1.5rem 1.75rem;
  display: flex; flex-direction: column; justify-content: flex-end;
}

/* Gesture log — replaces gesture-sub context */
#log-list {
  list-style: none;
  display: flex; flex-direction: column; gap: 2px;
  margin-bottom: 1.5rem;
}
.log-item {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 6px 8px;
  border-radius: 3px;
  font-family: 'Geist Mono', monospace;
  font-size: 10px; letter-spacing: 0.04em;
  color: var(--dim);
  transition: background 0.15s ease, color 0.15s ease;
}
.log-item.active { background: var(--ink); color: var(--white); }
.log-item.active.is-shake { background: var(--hit); }
.log-item.active.is-wave  { background: var(--sweep); }
.log-badge {
  margin-left: auto;
  font-size: 9px; opacity: 0.6;
}

#rail-bottom {
  padding: 1.25rem 1.75rem 1.5rem;
  border-top: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 6px;
}

#status-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
#dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: #C4C2BA; flex-shrink: 0;
  transition: background 0.3s;
}
#dot.on  { background: var(--go); }
#dot.blink { background: var(--go); animation: blink 0.7s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

#status-txt {
  font-family: 'Geist Mono', monospace;
  font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--dim);
}

.btn {
  display: flex; align-items: center; gap: 6px;
  width: 100%; padding: 8px 12px;
  font-family: 'Geist Mono', monospace;
  font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
  cursor: pointer; border-radius: 2px;
  transition: transform 0.07s, opacity 0.07s;
  user-select: none;
}
.btn:active { transform: scale(0.97) translateY(1px); }

.btn-fill { background: var(--ink); color: var(--white); border: none; }
.btn-fill:disabled { opacity: 0.28; cursor: not-allowed; }
.btn-fill:disabled:active { transform: none; }
.btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }

.btn kbd {
  display: inline-flex; align-items: center; justify-content: center;
  width: 14px; height: 14px;
  background: rgba(255,255,255,0.14);
  border-radius: 2px; font-size: 8px;
}
.btn-ghost kbd { background: rgba(0,0,0,0.05); }

#hint {
  font-family: 'Geist Mono', monospace;
  font-size: 9px; letter-spacing: 0.06em;
  color: var(--dim); opacity: 0.55;
  margin-top: 2px; line-height: 1.7;
}

/* ─── STAGE ───────────────────────────────────────────────── */
#stage {
  flex: 1; position: relative;
  background: var(--white);
  overflow: hidden;
}

/* Stage meta labels (editorial corner annotations) */
.stage-tag {
  position: absolute; z-index: 5;
  font-family: 'Geist Mono', monospace;
  font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--dim); pointer-events: none;
}
#tag-tl { top: 1.5rem; left: 1.75rem; }
#tag-tr { top: 1.5rem; right: 1.75rem; text-align: right; }

/* Thin horizontal rule lines — editorial structure */
#rule-top {
  position: absolute; top: 2.75rem; left: 0; right: 0;
  height: 1px; background: var(--line); z-index: 4; pointer-events: none;
}

#canvas { position: absolute; inset: 0; z-index: 0; pointer-events: none; }

/* ─── SANDBAG ─────────────────────────────────────────────── */
#bag-wrap {
  position: absolute; top: 0; left: 50%;
  transform: translateX(-50%);
  transform-origin: top center;
  z-index: 2; pointer-events: none; will-change: transform;
}
#bag-cord {
  display: block; margin: 0 auto;
  width: 1px; height: 88px;
  background: linear-gradient(to bottom, #B8B4AC, #A0998E);
}
#bag-img {
  display: block; width: 148px; height: auto; margin: 0 auto;
  filter: drop-shadow(0 18px 36px rgba(17,17,16,0.13));
}
#bag-svg { display: block; margin: 0 auto; }

/* ─── STRESS OBJECT ───────────────────────────────────────── */
#obj-wrap {
  position: absolute; z-index: 3;
  pointer-events: none; will-change: transform, opacity;
  display: flex; flex-direction: column; align-items: flex-start;
}

#obj-inner { position: relative; display: inline-block; }

#obj-img {
  display: block; width: 148px; height: auto;
  filter: drop-shadow(0 12px 24px rgba(17,17,16,0.11));
}
#obj-svg-wrap { filter: drop-shadow(0 12px 24px rgba(17,17,16,0.09)); }

/* Count badge — red pill (1X / 3X from reference) */
#obj-badge {
  position: absolute; top: -13px; right: -18px;
  display: none; align-items: center; justify-content: center;
  min-width: 42px; height: 42px; padding: 0 9px;
  background: var(--hit); color: var(--white);
  border-radius: 21px;
  font-family: 'Geist Mono', monospace;
  font-size: 11px; font-weight: 500; letter-spacing: 0.03em;
  z-index: 4;
}

/* Annotation under object */
#obj-label {
  margin-top: 11px;
  font-family: 'Geist Mono', monospace;
  font-size: 9px; letter-spacing: 0.26em; text-transform: uppercase;
  color: var(--dim); white-space: nowrap;
}

/* ─── IMPACT WORD ─────────────────────────────────────────── */
#impact {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 20; pointer-events: none;
  text-align: left; opacity: 0; white-space: nowrap;
}
#impact-main {
  display: block;
  font-size: clamp(4.5rem, 13vw, 10rem);
  font-weight: 900;
  letter-spacing: -0.05em;
  line-height: 0.85;
  text-transform: uppercase;
  color: var(--ink);
}
#impact-sub {
  display: block;
  font-family: 'Geist Mono', monospace;
  font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--dim);
  margin-top: 6px;
}

/* ─── FLASH ───────────────────────────────────────────────── */
#flash {
  position: absolute; inset: 0; z-index: 15;
  pointer-events: none; opacity: 0;
  background: rgba(212,53,28,0.04);
}
#flash.sw { background: rgba(26,86,219,0.04); }

/* ─── SHAKE ───────────────────────────────────────────────── */
#stage.shake { animation: shk 0.17s ease; }
@keyframes shk {
  0%  { transform: translate(0,0); }
  15% { transform: translate(-5px,2px); }
  30% { transform: translate(5px,-2px); }
  45% { transform: translate(-3px,3px); }
  60% { transform: translate(4px,-2px); }
  75% { transform: translate(-2px,1px); }
  90% { transform: translate(2px,-1px); }
  100%{ transform: translate(0,0); }
}

/* ─── CLEARED ─────────────────────────────────────────────── */
#cleared {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 25; text-align: left;
  opacity: 0; pointer-events: none;
}
#cleared-main {
  font-size: clamp(4rem, 10vw, 8rem);
  font-weight: 900; letter-spacing: -0.05em;
  line-height: 0.85; text-transform: uppercase;
  color: var(--ink);
}
#cleared-sub {
  font-family: 'Geist Mono', monospace;
  font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--dim); margin-top: 1rem;
}

/* ─── MARQUEE ─────────────────────────────────────────────── */
#marquee {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 32px; background: var(--ink);
  overflow: hidden; z-index: 30;
  display: flex; align-items: center;
}
#mq-track {
  display: flex; white-space: nowrap;
  animation: scroll 24s linear infinite;
}
@keyframes scroll { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
.mq { font-family: 'Geist Mono', monospace; font-size: 9px;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: rgba(244,242,238,0.3); padding: 0 1.25rem; }
.mq-dot { color: rgba(212,53,28,0.5); padding: 0 0.1rem;
  font-size: 9px; font-family: 'Geist Mono', monospace; letter-spacing: 0; }
</style>
</head>
<body>
<div id="app">

  <!-- RAIL -->
  <aside id="rail">
    <div id="rail-top">
      <div id="brand">SMASH · Gesture UI</div>
      <div id="hl-block">
        <div id="hl-label">current gesture</div>
        <div id="hl-word">—</div>
        <div id="hl-sub">awaiting connection</div>
      </div>
    </div>

    <div id="rail-mid">
      <ul id="log-list">
        <li class="log-item" id="log-shake">
          shake <span class="log-badge" id="cnt-shake">0</span>
        </li>
        <li class="log-item" id="log-wave">
          wave <span class="log-badge" id="cnt-wave">0</span>
        </li>
        <li class="log-item" id="log-idle">
          idle <span class="log-badge" id="cnt-idle">0</span>
        </li>
      </ul>
    </div>

    <div id="rail-bottom">
      <div id="status-row">
        <div id="dot"></div>
        <span id="status-txt">disconnected</span>
      </div>
      <button class="btn btn-fill" id="btn-rec" disabled>
        <kbd>R</kbd> record gesture
      </button>
      <button class="btn btn-ghost" id="btn-conn">
        connect device
      </button>
      <div id="hint">keyboard: 1 shake · 2 wave · 3 idle</div>
    </div>
  </aside>

  <!-- STAGE -->
  <main id="stage">
    <canvas id="canvas"></canvas>

    <div class="stage-tag" id="tag-tl">10-min break</div>
    <div class="stage-tag" id="tag-tr" id="tag-gesture-count"></div>
    <div id="rule-top"></div>

    <!-- Sandbag -->
    <div id="bag-wrap">
      <div id="bag-cord"></div>
      <img id="bag-img" src="assets/sandbag.png" alt=""
           onerror="this.style.display='none';document.getElementById('bag-svg-wrap').style.display='block'">
      <div id="bag-svg-wrap" style="display:none">
        <svg id="bag-svg" width="148" height="210" viewBox="0 0 148 210" fill="none">
          <ellipse cx="74" cy="26" rx="11" ry="7" fill="#CEC5B0" stroke="#B0A490" stroke-width="1.5"/>
          <rect x="20" y="32" width="108" height="154" rx="6" fill="#EDE8DF" stroke="#BDB5A4" stroke-width="1.5"/>
          <line x1="20" y1="84"  x2="128" y2="84"  stroke="#BDB5A4" stroke-width="0.8" stroke-dasharray="5 4"/>
          <line x1="20" y1="122" x2="128" y2="122" stroke="#BDB5A4" stroke-width="0.8" stroke-dasharray="5 4"/>
          <line x1="20" y1="160" x2="128" y2="160" stroke="#BDB5A4" stroke-width="0.8" stroke-dasharray="5 4"/>
          <ellipse cx="74" cy="185" rx="52" ry="9" fill="#DDD6C8" stroke="#BDB5A4" stroke-width="1"/>
        </svg>
      </div>
    </div>

    <!-- Stress object -->
    <div id="obj-wrap" style="display:none; opacity:0">
      <div id="obj-inner">
        <img id="obj-img" src="" alt="" style="display:none">
        <div id="obj-svg-wrap"></div>
        <div id="obj-badge"></div>
      </div>
      <div id="obj-label"></div>
    </div>

    <!-- Impact word -->
    <div id="impact">
      <span id="impact-main"></span>
      <span id="impact-sub"></span>
    </div>

    <!-- Flash -->
    <div id="flash"></div>

    <!-- Cleared -->
    <div id="cleared">
      <div id="cleared-main">All<br>Clear</div>
      <div id="cleared-sub">restarting cycle</div>
    </div>

    <!-- Marquee -->
    <div id="marquee">
      <div id="mq-track">
        <span class="mq">shake</span><span class="mq-dot">·</span>
        <span class="mq">wave</span><span class="mq-dot">·</span>
        <span class="mq">smash</span><span class="mq-dot">·</span>
        <span class="mq">punch</span><span class="mq-dot">·</span>
        <span class="mq">relief</span><span class="mq-dot">·</span>
        <span class="mq">clear</span><span class="mq-dot">·</span>
        <span class="mq">slice</span><span class="mq-dot">·</span>
        <span class="mq">let go</span><span class="mq-dot">·</span>
        <span class="mq">shake</span><span class="mq-dot">·</span>
        <span class="mq">wave</span><span class="mq-dot">·</span>
        <span class="mq">smash</span><span class="mq-dot">·</span>
        <span class="mq">punch</span><span class="mq-dot">·</span>
        <span class="mq">relief</span><span class="mq-dot">·</span>
        <span class="mq">clear</span><span class="mq-dot">·</span>
        <span class="mq">slice</span><span class="mq-dot">·</span>
        <span class="mq">let go</span><span class="mq-dot">·</span>
      </div>
    </div>
  </main>
</div>

<script>
// ── CONSTANTS ─────────────────────────────────────────────────────────────────

const QUEUE = ['alarm', 'email', 'slack', 'invoice'];

const COUNTS = { alarm:'5×', email:'12×', slack:'47×', invoice:'3×' };

const WORDS_SHAKE  = ['SMASH', 'POW', 'CRUSH', 'BAM', 'WHAM'];

const SVG = {

// ── STATE ─────────────────────────────────────────────────────────────────────

const S = {
  phase: 'IDLE',
  queue: [],
  objKey: null,
  cycle: 0,
  counts: { shake:0, wave:0, idle:0 },
  port: null, writer: null, connected: false,
  bagAngle: 0, bagV: 0, bagDamp: 0.93, bagPhase: 0,
  ox: 0, oy: 0, otilt: 0, ophase: 0, ovis: false,
};

// ── DOM ───────────────────────────────────────────────────────────────────────

const $stage   = document.getElementById('stage');
const $canvas  = document.getElementById('canvas');
const $bagWrap = document.getElementById('bag-wrap');
const $objWrap = document.getElementById('obj-wrap');
const $objInner= document.getElementById('obj-inner');
const $objBadge= document.getElementById('obj-badge');
const $objLabel= document.getElementById('obj-label');
const $impact  = document.getElementById('impact');
const $impMain = document.getElementById('impact-main');
const $impSub  = document.getElementById('impact-sub');
const $flash   = document.getElementById('flash');
const $cleared = document.getElementById('cleared');
const $hlWord  = document.getElementById('hl-word');
const $hlSub   = document.getElementById('hl-sub');
const $dot     = document.getElementById('dot');
const $stTxt   = document.getElementById('status-txt');
const $btnRec  = document.getElementById('btn-rec');
const $btnConn = document.getElementById('btn-conn');
const $tagTR   = document.getElementById('tag-tr');
const $logShake= document.getElementById('log-shake');
const $logWave = document.getElementById('log-wave');
const $logIdle = document.getElementById('log-idle');
const $cntShake= document.getElementById('cnt-shake');
const $cntWave = document.getElementById('cnt-wave');
const $cntIdle = document.getElementById('cnt-idle');

const ctx = $canvas.getContext('2d');

const getObjImg = () => document.getElementById('obj-img');
const getObjSvg = () => document.getElementById('obj-svg-wrap');

new ResizeObserver(() => {
  $canvas.width  = $stage.offsetWidth;
  $canvas.height = $stage.offsetHeight;
}).observe($stage);
$canvas.width  = $stage.offsetWidth;
$canvas.height = $stage.offsetHeight;

// ── PARTICLES ─────────────────────────────────────────────────────────────────

const particles = [], ripples = [];

class Particle {
  constructor(x, y, type) {
    this.x = x; this.y = y;
    this.shape = Math.random() < 0.5 ? 'rect' : 'circle';
    this.size  = 3 + Math.random() * 7;
    const spd  = 3 + Math.random() * 11;
    const ang  = Math.random() * Math.PI * 2;
    this.vx = Math.cos(ang) * spd;
    this.vy = Math.sin(ang) * spd - (type === 'shake' ? 4 : 2);
    this.g = 0.45;
    this.decay = 0.015 + Math.random() * 0.012;
    this.alpha = 1;
    this.rot = Math.random() * Math.PI * 2;
    this.rotV = (Math.random() - 0.5) * 0.28;
    const palShake = ['#D4351C','#111110','#79776F','#C4C2BA','#FAFAF8'];
    const palWave  = ['#1A56DB','#2563EB','#79776F','#BFCEF8','#FAFAF8'];
    const pal = type === 'shake' ? palShake : palWave;
    this.color = pal[Math.floor(Math.random() * pal.length)];
  }
  update() {
    this.vy += this.g; this.vx *= 0.97;
    this.x += this.vx; this.y += this.vy;
    this.rot += this.rotV;
    this.alpha = Math.max(0, this.alpha - this.decay);
  }
  draw(ctx) {
    if (this.alpha <= 0) return;
    ctx.save(); ctx.globalAlpha = this.alpha; ctx.fillStyle = this.color;
    ctx.translate(this.x, this.y); ctx.rotate(this.rot);
    if (this.shape === 'rect')
      ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size * 0.55);
    else { ctx.beginPath(); ctx.arc(0, 0, this.size/2, 0, Math.PI*2); ctx.fill(); }
    ctx.restore();
  }
}

class Ripple {
  constructor(x, y) { this.x=x; this.y=y; this.r=0; this.alpha=0.55; this.spd=8; }
  update() { this.r += this.spd; this.alpha -= 0.011; }
  draw(ctx) {
    if (this.alpha <= 0) return;
    ctx.save(); ctx.globalAlpha = this.alpha;
    ctx.strokeStyle = '#1A56DB'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

function spawnParts(x, y, type) {
  const n = type === 'shake' ? 90 : 36;
  for (let i = 0; i < n; i++) particles.push(new Particle(x, y, type));
}
function spawnRipples(x, y) {
  for (let i = 0; i < 4; i++) setTimeout(() => ripples.push(new Ripple(x, y)), i * 85);
}

// ── SANDBAG ───────────────────────────────────────────────────────────────────

function punchBag(f) { S.bagV = f * (Math.random() < 0.5 ? 1 : -1); }

function updateBag() {
  if (S.phase === 'IDLE' || !S.connected) {
    S.bagPhase += 0.011;
    S.bagAngle = Math.sin(S.bagPhase) * 2.8;
  } else {
    S.bagV -= S.bagAngle * 0.08;
    S.bagV *= S.bagDamp;
    S.bagAngle += S.bagV;
  }
  $bagWrap.style.transform = `translateX(-50%) rotate(${S.bagAngle}deg)`;
}

// ── OBJECT MANAGEMENT ────────────────────────────────────────────────────────

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getPos() {
  const W = $stage.offsetWidth;
  const H = $stage.offsetHeight - 32;
  const side = Math.random() < 0.5 ? -1 : 1;
  const x = W / 2 + side * (90 + Math.random() * 90);
  const y = H * 0.2 + Math.random() * H * 0.22;
  return { x, y };
}

function loadObj(key) {
  S.objKey = key;
  const src = `assets/${key}.png`;
  const img = new Image();
  img.onload = () => {
    const el = getObjImg(); const sv = getObjSvg();
    if (el) { el.src = src; el.style.display = 'block'; }
    if (sv) sv.innerHTML = '';
    revealObj();
  };
  img.onerror = () => {
    const el = getObjImg(); const sv = getObjSvg();
    if (el) el.style.display = 'none';
    if (sv) sv.innerHTML = SVG[key] || '';
    revealObj();
  };
  img.src = src;
}

function revealObj() {
  const p = getPos();
  S.ox = p.x; S.oy = p.y;
  S.otilt  = (Math.random() - 0.5) * 20;
  S.ophase = Math.random() * Math.PI * 2;
  S.ovis   = true;

  const badge = document.getElementById('obj-badge');
  if (badge) { badge.textContent = COUNTS[S.objKey] || ''; badge.style.display = 'flex'; }
  $objLabel.textContent = LABELS[S.objKey] || '';

  $objWrap.style.display  = 'flex';
  $objWrap.style.opacity  = '0';
  $objWrap.style.transform = tf(S.ox, S.oy - 28, S.otilt);

  requestAnimationFrame(() => {
    $objWrap.style.transition = 'opacity 0.38s cubic-bezier(0.16,1,0.3,1), transform 0.38s cubic-bezier(0.16,1,0.3,1)';
    $objWrap.style.opacity    = '1';
    $objWrap.style.transform  = tf(S.ox, S.oy, S.otilt);
    setTimeout(() => { $objWrap.style.transition = ''; S.phase = 'OBJECT_ACTIVE'; }, 400);
  });
}

function hideObj() {
  S.ovis = false;
  $objWrap.style.display = 'none';
  $objWrap.style.opacity = '0';
}

const tf = (x, y, r, sc) =>
  sc != null
    ? `translate(${x}px,${y}px) rotate(${r}deg) scale(${sc})`
    : `translate(${x}px,${y}px) rotate(${r}deg)`;

// ── GAME ─────────────────────────────────────────────────────────────────────

function startGame() {
  if (S.phase !== 'IDLE') return;
  S.queue = shuffle(QUEUE);
  S.phase = 'WAITING';
  setTimeout(nextObj, 500);
}

function nextObj() {
  if (!S.queue.length) { showCleared(); return; }
  loadObj(S.queue.shift());
}

function destroyObj(type) {
  if (S.phase !== 'OBJECT_ACTIVE') return;
  S.phase = 'DESTROYING';

  const el = getObjImg();
  const sv = getObjSvg();
  const ref = (el && el.style.display !== 'none') ? el : (sv ? sv.firstElementChild : null);
  const w = ref ? (ref.clientWidth  || 148) : 148;
  const h = ref ? (ref.clientHeight || 148) : 148;
  const cx = S.ox + w / 2, cy = S.oy + h / 2;

  spawnParts(cx, cy, type);
  if (type === 'wave') spawnRipples(cx, cy);

  const words = type === 'shake' ? WORDS_SHAKE : WORDS_WAVE;
  const subs  = type === 'shake' ? SUB_SHAKE   : SUB_WAVE;
  $impMain.textContent = words[Math.floor(Math.random() * words.length)];
  $impSub.textContent  = subs[Math.floor(Math.random() * subs.length)];
  animImpact();
  doFlash(type);

  if (type === 'shake') {
    const ang  = (Math.random() * Math.PI * 0.8) - Math.PI * 0.4 - Math.PI / 2;
    const dir  = { x: Math.cos(ang) * 22, y: Math.sin(ang) * 22 };
    let rot = S.otilt, rotV = (Math.random() - 0.5) * 16;
    let f = 0; const T = 34;
    const sx = S.ox, sy = S.oy;
    const step = () => {
      f++;
      rot += rotV;
      const sc  = Math.max(0, 1 - f / T);
      const alp = Math.max(0, 1 - (f / T) * 1.2);
      $objWrap.style.transform = tf(sx + dir.x * f, sy + dir.y * f, rot, sc);
      $objWrap.style.opacity   = String(alp);
      if (f < T) requestAnimationFrame(step);
      else { hideObj(); restoreObjMarkup(); pause(); }
    };
    requestAnimationFrame(step);
  } else {
    let f = 0; const T = 26;
    const sx = S.ox, sy = S.oy;
    const dir = Math.random() < 0.5 ? 1 : -1;
    const step = () => {
      f++;
      const t   = f / T;
      const alp = Math.max(0, 1 - t * 1.2);
      $objWrap.style.transform = tf(sx + dir * t * 280, sy, S.otilt + dir * t * 28);
      $objWrap.style.opacity   = String(alp);
      if (f < T) requestAnimationFrame(step);
      else { hideObj(); restoreObjMarkup(); pause(); }
    };
    requestAnimationFrame(step);
  }
}

function restoreObjMarkup() {
  $objInner.innerHTML = `
    <img id="obj-img" src="" alt="" style="display:none">
    <div id="obj-svg-wrap"></div>
    <div id="obj-badge"></div>
  `;
}

function pause() {
  S.phase = 'PAUSE';
  setTimeout(() => {
    if (!S.queue.length) showCleared();
    else { S.phase = 'WAITING'; nextObj(); }
  }, 600);
}

function showCleared() {
  S.phase = 'PAUSE';
  $cleared.style.transition = 'opacity 0.35s ease';
  $cleared.style.opacity    = '1';
  setTimeout(() => {
    $cleared.style.opacity = '0';
    setTimeout(() => {
      S.cycle++;
      S.queue = shuffle(QUEUE);
      S.phase = 'WAITING';
      nextObj();
    }, 450);
  }, 2200);
}

// ── EFFECTS ──────────────────────────────────────────────────────────────────

function animImpact() {
  $impact.style.transition = 'none';
  $impact.style.opacity    = '0';
  $impact.style.transform  = 'translate(-50%,-50%) scale(1.12)';
  requestAnimationFrame(() => {
    $impact.style.transition = 'opacity 0.07s ease, transform 0.09s cubic-bezier(0.16,1,0.3,1)';
    $impact.style.opacity    = '1';
    $impact.style.transform  = 'translate(-50%,-50%) scale(1)';
    setTimeout(() => {
      $impact.style.transition = 'opacity 0.45s ease';
      $impact.style.opacity    = '0';
    }, 130);
  });
}

function doFlash(type) {
  $flash.className = type === 'wave' ? 'sw' : '';
  $flash.style.transition = 'none'; $flash.style.opacity = '1';
  setTimeout(() => { $flash.style.transition = 'opacity 0.14s ease'; $flash.style.opacity = '0'; }, 70);
}

function doShake() {
  $stage.classList.remove('shake'); void $stage.offsetWidth;
  $stage.classList.add('shake');
  $stage.addEventListener('animationend', () => $stage.classList.remove('shake'), { once: true });
}

// ── FLOAT ────────────────────────────────────────────────────────────────────

function floatObj() {
  if (S.phase !== 'OBJECT_ACTIVE' || !S.ovis) return;
  S.ophase += 0.017;
  const fy = Math.sin(S.ophase) * 6.5;
  const fr = Math.sin(S.ophase * 0.72) * 1.4;
  $objWrap.style.transform = tf(S.ox, S.oy + fy, S.otilt + fr);
}

// ── MAIN LOOP ─────────────────────────────────────────────────────────────────

function loop() {
  ctx.clearRect(0, 0, $canvas.width, $canvas.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update(); particles[i].draw(ctx);
    if (particles[i].alpha <= 0) particles.splice(i, 1);
  }
  for (let i = ripples.length - 1; i >= 0; i--) {
    ripples[i].update(); ripples[i].draw(ctx);
    if (ripples[i].alpha <= 0) ripples.splice(i, 1);
  }
  updateBag();
  floatObj();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ── GESTURE HANDLER ──────────────────────────────────────────────────────────

function gesture(raw) {
  const g = raw.trim().toLowerCase();
  if (!['shake', 'wave', 'idle'].includes(g)) return;
  S.counts[g]++;

  // Update headline
  $hlWord.textContent = g !== 'idle' ? g.toUpperCase() : '—';
  $hlWord.className   = g !== 'idle' ? `is-${g}` : '';
  $hlSub.textContent  = g !== 'idle'
    ? `${g} detected · #${S.counts[g]}`
    : 'no gesture';

  // Update log rows
  [$logShake, $logWave, $logIdle].forEach(el => {
    el.className = 'log-item';
  });
  const map = { shake: $logShake, wave: $logWave, idle: $logIdle };
  if (map[g]) map[g].className = `log-item active is-${g}`;
  $cntShake.textContent = S.counts.shake;
  $cntWave.textContent  = S.counts.wave;
  $cntIdle.textContent  = S.counts.idle;

  // Top-right count tag
  $tagTR.textContent = g !== 'idle' ? `#${S.counts[g]} ${g}` : '';

  if (g === 'shake') {
    punchBag(14); doShake();
    if (S.phase === 'OBJECT_ACTIVE') destroyObj('shake');
    else if (S.phase === 'IDLE' && S.connected) startGame();
  } else if (g === 'wave') {
    punchBag(6);
    if (S.phase === 'OBJECT_ACTIVE') destroyObj('wave');
    else if (S.phase === 'IDLE' && S.connected) startGame();
  }
}

// ── WEB SERIAL ───────────────────────────────────────────────────────────────

async function connectSerial() {
  if (!navigator.serial) { alert('Web Serial requires Chrome or Edge.'); return; }
  try {
    S.port = await navigator.serial.requestPort();
    await S.port.open({ baudRate: 115200 });
    S.connected = true; setConnUI(true);
    const dec = new TextDecoderStream();
    const rd  = dec.readable.getReader();
    S.port.readable.pipeTo(dec.writable);
    S.writer = S.port.writable.getWriter();
    let buf = '';
    (async () => {
      try {
        while (true) {
          const { value, done } = await rd.read();
          if (done) break;
          buf += value;
          const lines = buf.split('\n'); buf = lines.pop();
          for (const line of lines) {
            const clean = line.trim();
            if (!clean || ['READY','START','END','Recording...'].includes(clean)) continue;
            gesture(clean);
          }
        }
      } catch {}
      setConnUI(false); S.connected = false;
    })();
    startGame();
  } catch (e) { if (e.name !== 'NotFoundError') console.error(e); }
}

async function sendRecord() {
  if (!S.writer) return;
  try {
    await S.writer.write(new TextEncoder().encode('r'));
    $dot.className = 'blink'; $stTxt.textContent = 'recording…';
    setTimeout(() => { $dot.className = 'on'; $stTxt.textContent = 'connected'; }, 2500);
  } catch {}
}

function setConnUI(on) {
  $dot.className    = on ? 'on' : '';
  $stTxt.textContent = on ? 'connected' : 'disconnected';
  $btnRec.disabled  = !on;
  $hlSub.textContent = on ? 'awaiting gesture' : 'awaiting connection';
  $btnConn.textContent = on ? 'disconnect' : 'connect device';
}

// ── KEYBOARD ─────────────────────────────────────────────────────────────────

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === '1') gesture('shake');
  else if (e.key === '2') gesture('wave');
  else if (e.key === '3') gesture('idle');
  else if (e.key === 'r' || e.key === 'R') {
    if (S.connected) sendRecord(); else gesture('shake');
  }
});

// ── BUTTONS ──────────────────────────────────────────────────────────────────

$btnConn.addEventListener('click', () => {
  if (S.connected) {
    try { S.port?.close(); } catch {}
    setConnUI(false); S.connected = false; S.port = null; S.writer = null;
  } else connectSerial();
});
$btnRec.addEventListener('click', sendRecord);

// ── INIT ─────────────────────────────────────────────────────────────────────

S.phase = 'IDLE';
</script>
</body>
</html>
