<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>SMASH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,400&family=Geist:wght@300;400;700;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:   #111110;
  --paper: #FAFAF8;
  --dim:   #8A8880;
  --line:  rgba(17,17,16,0.07);
  --red:   #D4351C;
  --blue:  #1A4FDB;
  --go:    #16A34A;
}

html, body {
  width: 100%; height: 100dvh;
  overflow: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Geist', sans-serif;
}

/* ── STAGE ───────────────────────────────────────────────── */
#stage {
  width: 100%; height: 100dvh;
  position: relative;
  overflow: hidden;
  background: #FFFFFF;
}

#canvas { position: absolute; inset: 0; z-index: 0; pointer-events: none; }

/* ── CORNER LABEL ───────────────────────────────────────── */
.corner {
  position: absolute; z-index: 5; pointer-events: none;
  font-family: 'Geist Mono', monospace;
  font-size: 9px; letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--dim);
}
#c-bl { bottom: 5.5rem; left: 2rem; }

/* ── GHOST BG TEXT ───────────────────────────────────────── */
#ghost {
  position: absolute;
  bottom: 3%;
  left: -1%;
  font-family: 'Geist', sans-serif;
  font-size: clamp(8rem, 22vw, 20rem);
  font-weight: 900;
  letter-spacing: -0.06em;
  line-height: 1;
  text-transform: uppercase;
  color: rgba(17,17,16,0.035);
  pointer-events: none;
  user-select: none;
  z-index: 0;
  white-space: nowrap;
  transition: color 0.4s ease;
}
#ghost.is-shake { color: rgba(212,53,28,0.04); }
#ghost.is-wave  { color: rgba(26,79,219,0.04); }

/* ── SANDBAG ─────────────────────────────────────────────── */
#bag-wrap {
  position: absolute; top: 0; left: 50%;
  transform: translateX(-50%);
  transform-origin: top center;
  z-index: 2; pointer-events: none;
  will-change: transform;
}
#bag-cord {
  display: block; margin: 0 auto;
  width: 1px; height: 80px;
  background: linear-gradient(to bottom, #B0ACA4, #989088);
}
#bag-img {
  display: block; width: 220px; height: auto; margin: 0 auto;
  filter: drop-shadow(0 24px 48px rgba(17,17,16,0.14));
}
#bag-svg { display: block; margin: 0 auto; }

/* ── BOXING GLOVE ────────────────────────────────────────── */
#glove-wrap {
  position: absolute;
  /* anchor at sandbag hit zone: cord(80px) + ~60% of bag body */
  top: 196px; left: 50%;
  transform: translateX(-50%);
  z-index: 4; pointer-events: none;
  will-change: transform, opacity;
  display: none; opacity: 0;
}
#glove-img {
  display: block; width: 140px; height: auto;
  filter: drop-shadow(0 8px 20px rgba(17,17,16,0.18));
}

/* ── STRESS OBJECT ───────────────────────────────────────── */
#obj-wrap {
  position: absolute; z-index: 3;
  pointer-events: none; will-change: transform, opacity;
  display: flex; flex-direction: column; align-items: flex-start;
}

#obj-inner { position: relative; display: inline-block; }

#obj-img {
  display: block; width: 156px; height: auto;
  filter: drop-shadow(0 16px 32px rgba(17,17,16,0.12));
}
#obj-svg-wrap {
  filter: drop-shadow(0 16px 32px rgba(17,17,16,0.09));
}

/* Badge — red pill with count */
#obj-badge {
  position: absolute; top: -14px; right: -18px;
  min-width: 44px; height: 44px; padding: 0 10px;
  display: none; align-items: center; justify-content: center;
  background: var(--red); color: #fff;
  border-radius: 22px;
  font-family: 'Geist Mono', monospace;
  font-size: 11px; font-weight: 500; letter-spacing: 0.04em;
  z-index: 4;
}

/* Annotation */
#obj-label {
  margin-top: 13px;
  font-family: 'Geist Mono', monospace;
  font-size: 9px; letter-spacing: 0.26em; text-transform: uppercase;
  color: var(--dim); white-space: nowrap;
}

/* ── EDITORIAL TYPESET (gesture display, top-right) ─────── */
#typo-block {
  position: absolute;
  top: 5rem; right: 2rem;
  z-index: 5; pointer-events: none;
  text-align: right;
}
#typo-script {
  display: block;
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: clamp(2.2rem, 4vw, 3.4rem);
  font-weight: 400;
  line-height: 1;
  color: var(--ink);
  transition: color 0.15s ease;
}
#typo-script.is-shake { color: var(--red); }
#typo-script.is-wave  { color: var(--blue); }

#typo-bold {
  display: block;
  font-family: 'Geist', sans-serif;
  font-size: clamp(3.5rem, 7vw, 6rem);
  font-weight: 900;
  letter-spacing: -0.05em;
  line-height: 0.85;
  text-transform: uppercase;
  color: var(--ink);
  transition: color 0.15s ease;
}
#typo-bold.is-shake { color: var(--red); }
#typo-bold.is-wave  { color: var(--blue); }

/* ── IMPACT WORD ─────────────────────────────────────────── */
#impact {
  position: absolute; top: 46%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 20; pointer-events: none;
  text-align: center; opacity: 0; white-space: nowrap;
}
#impact-word {
  display: block;
  font-family: 'Geist', sans-serif;
  font-size: clamp(5rem, 15vw, 12rem);
  font-weight: 900;
  letter-spacing: -0.05em;
  line-height: 0.85;
  text-transform: uppercase;
  color: var(--ink);
}

/* ── FLASH ───────────────────────────────────────────────── */
#flash {
  position: absolute; inset: 0; z-index: 15;
  pointer-events: none; opacity: 0;
  background: rgba(212,53,28,0.04);
}
#flash.sw { background: rgba(26,79,219,0.04); }

/* ── SHAKE ───────────────────────────────────────────────── */
#stage.shake { animation: shk 0.18s ease; }
@keyframes shk {
  0%  { transform: translate(0,0); }
  14% { transform: translate(-5px,2px); }
  28% { transform: translate(5px,-2px); }
  43% { transform: translate(-4px,3px); }
  57% { transform: translate(4px,-2px); }
  71% { transform: translate(-2px,2px); }
  86% { transform: translate(2px,-1px); }
  100%{ transform: translate(0,0); }
}

/* ── CLEARED ─────────────────────────────────────────────── */
#cleared {
  position: absolute; top: 44%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 25; text-align: left;
  opacity: 0; pointer-events: none;
}
#cleared-script {
  display: block;
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: clamp(2.5rem, 5vw, 4.5rem);
  font-weight: 400;
  color: var(--ink); line-height: 1.1;
}
#cleared-bold {
  display: block;
  font-family: 'Geist', sans-serif;
  font-size: clamp(4rem, 9vw, 7.5rem);
  font-weight: 900;
  letter-spacing: -0.05em; line-height: 0.85;
  text-transform: uppercase; color: var(--ink);
}
#cleared-sub {
  font-family: 'Geist Mono', monospace;
  font-size: 9px; letter-spacing: 0.26em; text-transform: uppercase;
  color: var(--dim); margin-top: 1.25rem;
}

/* ── FLOATING HUD ────────────────────────────────────────── */
#hud {
  position: absolute;
  bottom: 1.75rem; left: 50%;
  transform: translateX(-50%);
  z-index: 30;
  display: flex; align-items: center; gap: 14px;
  background: rgba(71, 89, 115, 0.88);
  color: rgba(226,232,240,0.8);
  padding: 9px 18px;
  border-radius: 100px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  white-space: nowrap;
}

#hud-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: #555450; flex-shrink: 0;
  transition: background 0.3s;
}
#hud-dot.on    { background: var(--go); }
#hud-dot.blink { background: var(--go); animation: blink 0.7s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

#hud-status {
  font-family: 'Geist Mono', monospace;
  font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
}

#hud-sep {
  width: 1px; height: 14px;
  background: rgba(250,250,248,0.15);
}

#hud-btn {
  font-family: 'Geist Mono', monospace;
  font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  color: rgba(250,250,248,0.9);
  background: none; border: none;
  cursor: pointer; padding: 0;
  transition: color 0.1s;
}
#hud-btn:hover { color: #fff; }

#hud-hint {
  font-family: 'Geist Mono', monospace;
  font-size: 9px; letter-spacing: 0.08em;
  color: rgba(250,250,248,0.35);
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas"></canvas>

  <!-- Bottom-left gesture counter -->

  <!-- Ghost background typography -->

  <!-- Editorial type block (top-right) -->

  <!-- Sandbag -->
  <div id="bag-wrap">

    <div id="hud-dot"></div>
    <span id="hud-status">disconnected</span>
    <div id="hud-sep"></div>
    <button id="hud-btn">connect device</button>
    <div id="hud-sep2" style="width:1px;height:14px;background:rgba(250,250,248,0.15)"></div>
    <span id="hud-hint">1 shake · 2 wave · 3 idle</span>
  </div>
</div>

<script>
// ── CONSTANTS ─────────────────────────────────────────────────────────────────

const QUEUE = ['alarm', 'email', 'slack', 'invoice'];

const COUNTS  = { alarm:'5×', email:'12×', slack:'47×', invoice:'3×' };
const LABELS  = { alarm:'missed alarms', email:'unread emails', slack:'slack messages', invoice:'overdue invoices' };

const SCRIPT_MAP = { shake:'Impact', wave:'Ripple', idle:'Stress' };

const WORDS_SHAKE = ['SMASH', 'POW', 'CRUSH', 'BAM', 'WHAM'];
const WORDS_WAVE  = ['SLICE', 'SWEEP', 'GONE'];

const SVG = {
  alarm: `<svg width="124" height="124" viewBox="0 0 124 124" fill="none">
    <circle cx="62" cy="66" r="46" fill="#F0EDE8" stroke="#C8C3BC" stroke-width="1.5"/>
    <line x1="31" y1="29" x2="18" y2="16" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="15" cy="13" r="5.5" fill="#A8A098"/>
    <line x1="93" y1="29" x2="106" y2="16" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="109" cy="13" r="5.5" fill="#A8A098"/>
    <circle cx="62" cy="66" r="36" fill="#FAFAF8" stroke="#DDD9D2" stroke-width="1"/>
    <line x1="62" y1="35" x2="62" y2="41" stroke="#2A2A28" stroke-width="2" stroke-linecap="round"/>
    <line x1="62" y1="91" x2="62" y2="97" stroke="#2A2A28" stroke-width="2" stroke-linecap="round"/>
    <line x1="31" y1="66" x2="37" y2="66" stroke="#2A2A28" stroke-width="2" stroke-linecap="round"/>
    <line x1="87" y1="66" x2="93" y2="66" stroke="#2A2A28" stroke-width="2" stroke-linecap="round"/>
    <line x1="62" y1="66" x2="62" y2="49" stroke="#111110" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="62" y1="66" x2="77" y2="66" stroke="#111110" stroke-width="2" stroke-linecap="round"/>
    <circle cx="62" cy="66" r="3.5" fill="#D4351C"/>
    <rect x="44" y="109" width="13" height="5" rx="2.5" fill="#C0BAB0"/>
    <rect x="67" y="109" width="13" height="5" rx="2.5" fill="#C0BAB0"/>
  </svg>`,

  email: `<svg width="140" height="104" viewBox="0 0 140 104" fill="none">
    <rect x="4" y="8" width="132" height="84" rx="4" fill="#FAFAF8" stroke="#C8C3BC" stroke-width="1.5"/>
    <polyline points="4,8 70,58 136,8" stroke="#C8C3BC" stroke-width="1.5" fill="none"/>
    <line x1="4" y1="92" x2="54" y2="54" stroke="#C8C3BC" stroke-width="1.2"/>
    <line x1="136" y1="92" x2="86" y2="54" stroke="#C8C3BC" stroke-width="1.2"/>
  </svg>`,

  slack: `<svg width="114" height="114" viewBox="0 0 114 114" fill="none">
    <rect x="4" y="4" width="106" height="106" rx="14" fill="#FAFAF8" stroke="#C8C3BC" stroke-width="1.2"/>
    <rect x="19" y="19" width="30" height="30" rx="6" fill="#3A0F3C"/>
    <text x="34" y="40" text-anchor="middle" font-family="monospace" font-size="17" font-weight="900" fill="#FAFAF8">#</text>
    <rect x="57" y="23" width="36" height="4" rx="2" fill="#111110"/>
    <rect x="57" y="31" width="26" height="3.5" rx="1.75" fill="#A8A098"/>
    <rect x="19" y="59" width="72" height="3.5" rx="1.75" fill="#DDD9D2"/>
    <rect x="19" y="68" width="56" height="3.5" rx="1.75" fill="#DDD9D2"/>
    <rect x="19" y="77" width="64" height="3.5" rx="1.75" fill="#DDD9D2"/>
  </svg>`,

  invoice: `<svg width="92" height="122" viewBox="0 0 92 122" fill="none">
    <rect x="4" y="4" width="84" height="114" rx="3" fill="#FAFAF8" stroke="#C8C3BC" stroke-width="1.2"/>
    <polygon points="68,4 84,4 84,20" fill="#E0DDD6" stroke="#C8C3BC" stroke-width="1"/>
    <rect x="4" y="4" width="64" height="21" rx="3" fill="#111110"/>
    <rect x="13" y="11" width="30" height="4" rx="2" fill="white" opacity="0.7"/>
    <rect x="13" y="35" width="48" height="3.5" rx="1.75" fill="#DDD9D2"/>
    <rect x="13" y="43" width="36" height="3.5" rx="1.75" fill="#DDD9D2"/>
    <rect x="13" y="54" width="48" height="3.5" rx="1.75" fill="#E8E4DE"/>
    <rect x="13" y="62" width="40" height="3.5" rx="1.75" fill="#E8E4DE"/>
    <rect x="13" y="70" width="44" height="3.5" rx="1.75" fill="#E8E4DE"/>
    <line x1="13" y1="84" x2="79" y2="84" stroke="#DDD9D2" stroke-width="1"/>
    <rect x="13" y="89" width="28" height="4.5" rx="2" fill="#111110"/>
    <rect x="50" y="89" width="20" height="4.5" rx="2" fill="#D4351C"/>
    <rect x="15" y="101" width="58" height="8" rx="1" fill="none" stroke="#D4351C" stroke-width="1.2"/>
    <text x="44" y="108" text-anchor="middle" font-family="monospace" font-size="6.5" font-weight="700" fill="#D4351C" letter-spacing="0.12em">OVERDUE</text>
  </svg>`,
};

// ── STATE ─────────────────────────────────────────────────────────────────────

const S = {
  phase: 'IDLE',
  queue: [], objKey: null, cycle: 0,
  counts: { shake:0, wave:0, idle:0 },
  port: null, writer: null, connected: false,
  bagAngle: 0, bagV: 0, bagDamp: 0.93, bagPhase: 0,
  ox: 0, oy: 0, otilt: 0, ophase: 0, ovis: false,
};

// ── DOM ───────────────────────────────────────────────────────────────────────

const $stage     = document.getElementById('stage');
const $canvas    = document.getElementById('canvas');
const $bagWrap   = document.getElementById('bag-wrap');
const $objWrap   = document.getElementById('obj-wrap');
const $objInner  = document.getElementById('obj-inner');
const $objLabel  = document.getElementById('obj-label');
const $impact    = document.getElementById('impact');
const $impWord   = document.getElementById('impact-word');
const $flash     = document.getElementById('flash');
const $cleared   = document.getElementById('cleared');
const $ghost     = document.getElementById('ghost');
const $typoScript= document.getElementById('typo-script');
const $typoBold  = document.getElementById('typo-bold');
const $hudDot    = document.getElementById('hud-dot');
const $hudStatus = document.getElementById('hud-status');
const $hudBtn    = document.getElementById('hud-btn');
const $cBl       = document.getElementById('c-bl');

const ctx = $canvas.getContext('2d');

const getImg = () => document.getElementById('obj-img');
const getSvg = () => document.getElementById('obj-svg-wrap');
const getBadge = () => document.getElementById('obj-badge');

new ResizeObserver(() => {
  $canvas.width  = $stage.offsetWidth;
  $canvas.height = $stage.offsetHeight;
}).observe($stage);
$canvas.width  = $stage.offsetWidth;
$canvas.height = $stage.offsetHeight;

// ── PARTICLES ─────────────────────────────────────────────────────────────────

const particles = [], ripples = [];

class Particle {
  constructor(x, y, type) {
    this.x = x; this.y = y;
    this.shape = Math.random() < 0.5 ? 'rect' : 'circle';
    this.size  = 3 + Math.random() * 7;
    const spd  = 3 + Math.random() * 11;
    const ang  = Math.random() * Math.PI * 2;
    this.vx = Math.cos(ang) * spd;
    this.vy = Math.sin(ang) * spd - (type === 'shake' ? 4 : 2);
    this.g = 0.45; this.alpha = 1;
    this.decay = 0.015 + Math.random() * 0.011;
    this.rot = Math.random() * Math.PI * 2;
    this.rotV = (Math.random() - 0.5) * 0.28;
    const ps = type === 'shake'
      ? ['#D4351C','#111110','#8A8880','#C8C4BE','#FAFAF8']
      : ['#1A4FDB','#3B82F6','#8A8880','#BFCEF8','#FAFAF8'];
    this.color = ps[Math.floor(Math.random() * ps.length)];
  }
  update() {
    this.vy += this.g; this.vx *= 0.97;
    this.x += this.vx; this.y += this.vy;
    this.rot += this.rotV;
    this.alpha = Math.max(0, this.alpha - this.decay);
  }
  draw(c) {
    if (this.alpha <= 0) return;
    c.save(); c.globalAlpha = this.alpha; c.fillStyle = this.color;
    c.translate(this.x, this.y); c.rotate(this.rot);
    if (this.shape === 'rect') c.fillRect(-this.size/2, -this.size/2, this.size, this.size * 0.55);
    else { c.beginPath(); c.arc(0, 0, this.size/2, 0, Math.PI*2); c.fill(); }
    c.restore();
  }
}

class Ripple {
  constructor(x, y) { this.x=x; this.y=y; this.r=0; this.alpha=0.5; }
  update() { this.r += 8; this.alpha -= 0.01; }
  draw(c) {
    if (this.alpha <= 0) return;
    c.save(); c.globalAlpha = this.alpha;
    c.strokeStyle = '#1A4FDB'; c.lineWidth = 1.2;
    c.beginPath(); c.arc(this.x, this.y, this.r, 0, Math.PI*2); c.stroke();
    c.restore();
  }
}

function spawnParts(x, y, type) {
  for (let i = 0; i < (type === 'shake' ? 90 : 36); i++)
    particles.push(new Particle(x, y, type));
}
function spawnRipples(x, y) {
  for (let i = 0; i < 4; i++) setTimeout(() => ripples.push(new Ripple(x, y)), i * 85);
}

// ── BAG ───────────────────────────────────────────────────────────────────────

function punchBag(f) { S.bagV = f * (Math.random() < 0.5 ? 1 : -1); }

function updateBag() {
  if (S.phase === 'IDLE' || !S.connected) {
    S.bagPhase += 0.011;
    S.bagAngle = Math.sin(S.bagPhase) * 2.6;
  } else {
    S.bagV -= S.bagAngle * 0.08;
    S.bagV *= S.bagDamp;
    S.bagAngle += S.bagV;
  }
  $bagWrap.style.transform = `translateX(-50%) rotate(${S.bagAngle}deg)`;
}

// ── OBJECTS ───────────────────────────────────────────────────────────────────

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getPos() {
  const W = $stage.offsetWidth, H = $stage.offsetHeight;
  const side = Math.random() < 0.5 ? -1 : 1;
  const x = W / 2 + side * (100 + Math.random() * 100);
  const y = H * 0.2 + Math.random() * H * 0.2;
  return { x, y };
}

function loadObj(key) {
  S.objKey = key;
  const img = new Image();
  img.onload = () => {
    const el = getImg(); const sv = getSvg();
    if (el) { el.src = `asset/${key}.png`; el.style.display = 'block'; }
    if (sv) sv.innerHTML = '';
    showObj();
  };
  img.onerror = () => {
    const el = getImg(); const sv = getSvg();
    if (el) el.style.display = 'none';
    if (sv) sv.innerHTML = SVG[key] || '';
    showObj();
  };
  img.src = `asset/${key}.png`;
}

function showObj() {
  const p = getPos();
  S.ox = p.x; S.oy = p.y;
  S.otilt  = (Math.random() - 0.5) * 22;
  S.ophase = Math.random() * Math.PI * 2;
  S.ovis   = true;

  const badge = getBadge();
  if (badge) { badge.textContent = COUNTS[S.objKey] || ''; badge.style.display = 'flex'; }
  $objLabel.textContent = LABELS[S.objKey] || '';

  $objWrap.style.display   = 'flex';
  $objWrap.style.opacity   = '0';
  $objWrap.style.transform = tf(S.ox, S.oy - 30, S.otilt);

  requestAnimationFrame(() => {
    $objWrap.style.transition = 'opacity 0.4s cubic-bezier(0.16,1,0.3,1), transform 0.4s cubic-bezier(0.16,1,0.3,1)';
    $objWrap.style.opacity    = '1';
    $objWrap.style.transform  = tf(S.ox, S.oy, S.otilt);
    setTimeout(() => { $objWrap.style.transition = ''; S.phase = 'OBJECT_ACTIVE'; }, 420);
  });
}

function hideObj() {
  S.ovis = false;
  $objWrap.style.display = 'none';
  $objWrap.style.opacity = '0';
}

const tf = (x, y, r, sc) =>
  sc != null ? `translate(${x}px,${y}px) rotate(${r}deg) scale(${sc})`
             : `translate(${x}px,${y}px) rotate(${r}deg)`;

// ── GAME ──────────────────────────────────────────────────────────────────────

function startGame() {
  if (S.phase !== 'IDLE') return;
  S.queue = shuffle(QUEUE);
  S.phase = 'WAITING';
  setTimeout(nextObj, 500);
}

function nextObj() {
  if (!S.queue.length) { showCleared(); return; }
  loadObj(S.queue.shift());
}

function destroyObj(type) {
  if (S.phase !== 'OBJECT_ACTIVE') return;
  S.phase = 'DESTROYING';

  const el  = getImg(); const sv = getSvg();
  const ref = (el && el.style.display !== 'none') ? el : (sv ? sv.firstElementChild : null);
  const w   = ref ? (ref.clientWidth  || 156) : 156;
  const h   = ref ? (ref.clientHeight || 156) : 156;
  spawnParts(S.ox + w/2, S.oy + h/2, type);
  if (type === 'wave') spawnRipples(S.ox + w/2, S.oy + h/2);

  $impWord.textContent = (type === 'shake' ? WORDS_SHAKE : WORDS_WAVE)[
    Math.floor(Math.random() * (type === 'shake' ? WORDS_SHAKE : WORDS_WAVE).length)
  ];
  animImpact();
  doFlash(type);

  if (type === 'shake') {
    const ang = (Math.random() * Math.PI * 0.8) - Math.PI * 0.4 - Math.PI / 2;
    const dir = { x: Math.cos(ang) * 22, y: Math.sin(ang) * 22 };
    let rot = S.otilt, rotV = (Math.random() - 0.5) * 16;
    let f = 0; const T = 34; const sx = S.ox, sy = S.oy;
    const step = () => {
      f++; rot += rotV;
      $objWrap.style.transform = tf(sx + dir.x*f, sy + dir.y*f, rot, Math.max(0, 1-f/T));
      $objWrap.style.opacity   = String(Math.max(0, 1-(f/T)*1.2));
      if (f < T) requestAnimationFrame(step);
      else { hideObj(); restoreMarkup(); pause(); }
    };
    requestAnimationFrame(step);
  } else {
    let f = 0; const T = 26; const sx = S.ox, sy = S.oy;
    const dir = Math.random() < 0.5 ? 1 : -1;
    const step = () => {
      f++;
      const t = f / T;
      $objWrap.style.transform = tf(sx + dir*t*300, sy, S.otilt + dir*t*30);
      $objWrap.style.opacity   = String(Math.max(0, 1-t*1.2));
      if (f < T) requestAnimationFrame(step);
      else { hideObj(); restoreMarkup(); pause(); }
    };
    requestAnimationFrame(step);
  }
}

function restoreMarkup() {
  $objInner.innerHTML = `
    <img id="obj-img" src="" alt="" style="display:none">
    <div id="obj-svg-wrap"></div>
    <div id="obj-badge"></div>
  `;
}

function pause() {
  S.phase = 'PAUSE';
  setTimeout(() => {
    if (!S.queue.length) showCleared();
    else { S.phase = 'WAITING'; nextObj(); }
  }, 600);
}

function showCleared() {
  S.phase = 'PAUSE';
  $cleared.style.transition = 'opacity 0.35s ease';
  $cleared.style.opacity    = '1';
  setTimeout(() => {
    $cleared.style.opacity = '0';
    setTimeout(() => {
      S.cycle++;
      S.queue = shuffle(QUEUE);
      S.phase = 'WAITING';
      nextObj();
    }, 450);
  }, 2200);
}

// ── GLOVE ANIMATION ──────────────────────────────────────────────────────────
// Taste-skill MOTION_INTENSITY:7 — spring easing, transform/opacity only

function animateGlove() {
  const glove = document.getElementById('glove-wrap');
  if (!glove) return;

  // Randomise left or right punch
  const dir   = Math.random() < 0.5 ? 1 : -1;
  const offX  = dir * 110;   // horizontal offset of starting position
  const rot   = dir * -38;   // rotation at rest (below)
  const hitRot= dir * 8;     // slight angle at contact

  // Use correct directional glove image
  const img = document.getElementById('glove-img');
  if (img) img.src = dir === 1 ? 'asset/glove_right.png' : 'asset/glove_left.png';

  // Park below, invisible
  glove.style.transition = 'none';
  glove.style.transform  = `translateX(calc(-50% + ${offX}px)) translateY(280px) rotate(${rot}deg)`;
  glove.style.opacity    = '0';
  glove.style.display    = 'block';

  // Spring upswing — cubic-bezier(0.16, 1, 0.3, 1) for overshoot feel
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      glove.style.transition = 'transform 0.30s cubic-bezier(0.16,1,0.3,1), opacity 0.08s ease';
      glove.style.transform  = `translateX(calc(-50% + ${dir * 12}px)) translateY(0px) rotate(${hitRot}deg)`;
      glove.style.opacity    = '1';

      // Trigger bag + particles at contact (t=260ms)
      setTimeout(() => {
        punchBag(16);
      }, 240);

      // Retreat — ease-in, quick pull-back
      setTimeout(() => {
        glove.style.transition = 'transform 0.38s cubic-bezier(0.4,0,0.8,1), opacity 0.18s ease 0.2s';
        glove.style.transform  = `translateX(calc(-50% + ${offX}px)) translateY(280px) rotate(${rot}deg)`;
        glove.style.opacity    = '0';
        setTimeout(() => { glove.style.display = 'none'; }, 420);
      }, 300);
    });
  });
}

// ── EFFECTS ──────────────────────────────────────────────────────────────────

function animImpact() {
  $impact.style.transition = 'none';
  $impact.style.opacity    = '0';
  $impact.style.transform  = 'translate(-50%,-50%) scale(1.1)';
  requestAnimationFrame(() => {
    $impact.style.transition = 'opacity 0.07s ease, transform 0.1s cubic-bezier(0.16,1,0.3,1)';
    $impact.style.opacity    = '1';
    $impact.style.transform  = 'translate(-50%,-50%) scale(1)';
    setTimeout(() => {
      $impact.style.transition = 'opacity 0.5s ease';
      $impact.style.opacity    = '0';
    }, 130);
  });
}

function doFlash(type) {
  $flash.className = type === 'wave' ? 'sw' : '';
  $flash.style.transition = 'none'; $flash.style.opacity = '1';
  setTimeout(() => { $flash.style.transition = 'opacity 0.14s ease'; $flash.style.opacity = '0'; }, 70);
}

function doShake() {
  $stage.classList.remove('shake'); void $stage.offsetWidth;
  $stage.classList.add('shake');
  $stage.addEventListener('animationend', () => $stage.classList.remove('shake'), { once: true });
}

// ── FLOAT ─────────────────────────────────────────────────────────────────────

function floatObj() {
  if (S.phase !== 'OBJECT_ACTIVE' || !S.ovis) return;
  S.ophase += 0.017;
  const fy = Math.sin(S.ophase) * 6;
  const fr = Math.sin(S.ophase * 0.72) * 1.3;
  $objWrap.style.transform = tf(S.ox, S.oy + fy, S.otilt + fr);
}

// ── MAIN LOOP ─────────────────────────────────────────────────────────────────

function loop() {
  ctx.clearRect(0, 0, $canvas.width, $canvas.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update(); particles[i].draw(ctx);
    if (particles[i].alpha <= 0) particles.splice(i, 1);
  }
  for (let i = ripples.length - 1; i >= 0; i--) {
    ripples[i].update(); ripples[i].draw(ctx);
    if (ripples[i].alpha <= 0) ripples.splice(i, 1);
  }
  updateBag();
  floatObj();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ── GESTURE ───────────────────────────────────────────────────────────────────

function gesture(raw) {
  const g = raw.trim().toLowerCase();
  if (!['shake', 'wave', 'idle'].includes(g)) return;
  S.counts[g]++;

  $ghost.textContent = g !== 'idle' ? g.toUpperCase() : 'STRESS';
  $ghost.className   = g !== 'idle' ? `is-${g}` : '';

  $typoScript.textContent = SCRIPT_MAP[g] || 'Stress';
  $typoScript.className   = g !== 'idle' ? `is-${g}` : '';
  $typoBold.textContent   = g !== 'idle' ? g.toUpperCase() : 'SMASH';
  $typoBold.className     = g !== 'idle' ? `is-${g}` : '';

  $cBl.textContent = g !== 'idle' ? `${g} #${S.counts[g]}` : '';

  if (g === 'shake') {
    animateGlove(); doShake();
    if (S.phase === 'OBJECT_ACTIVE') destroyObj('shake');
    else if (S.phase === 'IDLE' && S.connected) startGame();
  } else if (g === 'wave') {
    punchBag(6);
    if (S.phase === 'OBJECT_ACTIVE') destroyObj('wave');
    else if (S.phase === 'IDLE' && S.connected) startGame();
  }
}

// ── SERIAL ───────────────────────────────────────────────────────────────────

async function connectSerial() {
  if (!navigator.serial) { alert('Web Serial requires Chrome or Edge.'); return; }
  try {
    S.port = await navigator.serial.requestPort();
    await S.port.open({ baudRate: 115200 });
    S.connected = true; setConnUI(true);
    const dec = new TextDecoderStream();
    const rd  = dec.readable.getReader();
    S.port.readable.pipeTo(dec.writable);
    S.writer = S.port.writable.getWriter();
    let buf = '';
    (async () => {
      try {
        while (true) {
          const { value, done } = await rd.read();
          if (done) break;
          buf += value;
          const lines = buf.split('\n'); buf = lines.pop();
          for (const line of lines) {
            const c = line.trim();
            if (!c || ['READY','START','END','Recording...'].includes(c)) continue;
            gesture(c);
          }
        }
      } catch {}
      setConnUI(false); S.connected = false;
    })();
    startGame();
  } catch (e) { if (e.name !== 'NotFoundError') console.error(e); }
}

async function sendRecord() {
  if (!S.writer) return;
  try {
    await S.writer.write(new TextEncoder().encode('r'));
    $hudDot.className = 'blink'; $hudStatus.textContent = 'recording…';
    setTimeout(() => { $hudDot.className = 'on'; $hudStatus.textContent = 'connected'; }, 2500);
  } catch {}
}

function setConnUI(on) {
  $hudDot.className      = on ? 'on' : '';
  $hudStatus.textContent = on ? 'connected' : 'disconnected';
  $hudBtn.textContent    = on ? 'disconnect' : 'connect device';
}

// ── KEYBOARD ─────────────────────────────────────────────────────────────────

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === '1') gesture('shake');
  else if (e.key === '2') gesture('wave');
  else if (e.key === '3') gesture('idle');
  else if (e.key === 'r' || e.key === 'R') {
    if (S.connected) sendRecord(); else gesture('shake');
  }
});

// ── BUTTONS ──────────────────────────────────────────────────────────────────

$hudBtn.addEventListener('click', () => {
  if (S.connected) {
    try { S.port?.close(); } catch {}
    setConnUI(false); S.connected = false; S.port = null; S.writer = null;
  } else connectSerial();
});

// ── INIT ─────────────────────────────────────────────────────────────────────

S.phase = 'IDLE';
</script>
</body>
